schema_version: 1

context:
  version: "0.7.3"
  python_min: "3.11"

package:
  name: deepagents
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/deepagents/deepagents-${{ version }}.tar.gz
  sha256: 73d13650ee257202257e80fec07bc1fb5a5c36b865d96a7ba383c27f9dde77fb

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=73.0.0
    - wheel
    - pip
  run:
    - python >=${{ python_min }}
    - langchain-core >=1.5.0,<2.0.0
    - langsmith >=0.10.9
    - langchain >=1.3.14,<2.0.0
    - langchain-anthropic >=1.5.3,<2.0.0
    - langchain-google-genai >=4.3.1,<5.0.0
    - wcmatch >=11.0

tests:
  - python:
      imports:
        - deepagents
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: General purpose 'deep agent' with sub-agent spawning, todo list capabilities, and mock file system. Built on LangGraph.
  license: MIT
  license_file: LICENSE
  homepage: https://docs.langchain.com/oss/python/deepagents/overview
  repository: https://github.com/langchain-ai/deepagents
  documentation: https://reference.langchain.com/python/deepagents/

extra:
  recipe-maintainers:
    - ccurme
    - mdrxy
    - timpalpant
